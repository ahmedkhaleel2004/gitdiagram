version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Toronto"
    labels:
      - "dependencies"

updates:
  - package-ecosystem: "bun"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    cooldown:
      default-days: 3
    ignore:
      - dependency-name: "eslint"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      # puppeteer-core must target the same Chrome as @sparticuz/chromium,
      # and Dependabot would move each to its own latest (the Chromium build
      # usually lags puppeteer's), so neither is updated here: bump them
      # together by hand to a matching pair.
      - dependency-name: "puppeteer-core"
      - dependency-name: "@sparticuz/chromium"

  - package-ecosystem: "bun"
    directory: "/workers/presence"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    cooldown:
      default-days: 3
    ignore:
      # @cloudflare/vitest-plugin supports Vitest 4 only; move with it.
      - dependency-name: "vitest"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "all-dependencies"
    cooldown:
      default-days: 3
