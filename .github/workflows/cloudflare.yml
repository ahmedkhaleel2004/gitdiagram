name: Cloudflare

# Builds the site with OpenNext and deploys it to the Cloudflare Worker
# `gitdiagram` (see "Cloudflare" in CLAUDE.md). The Worker's runtime secrets
# live in Cloudflare and are untouched by a deploy; this job only needs the
# values compiled into the build.
on:
  push:
    branches:
      - main
    # A deploy empties the page cache (its keys carry the build id) and
    # replaces the render containers, so a push that cannot change the site
    # does not deploy: root Markdown, docs, experiments, the other workflows
    # and the cost and benchmark scripts.
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "experiments/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cost-watch.yml"
      - ".github/workflows/sponsor-readme.yml"
      - "scripts/cf-usage.mjs"
      # Deployed by hand, each from its own folder.
      - "workers/errors/**"
      - "workers/presence/**"
      - "scripts/bench.mjs"
      # The staging copy and the video pipeline's test tools.
      - "cloudflare/staging.ts"
      - "scripts/cf-staging.mjs"
      - "scripts/video-pipeline-test.mjs"
      - "scripts/video-model-replay.mjs"
  workflow_dispatch:

# One deploy at a time, in order; a queued deploy is never cancelled halfway.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The deploy also builds and pushes the render containers' image (the
    # repo's Dockerfile: a second Next build plus Chromium), which needs the
    # runner's Docker.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun ci
      # Turbopack's build cache: a push that changes a few files recompiles
      # only those (about 60 s of build down to about 20 s).
      - name: Restore the Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: cf-next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: cf-next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      # The containers' image is named after what goes into it, and its own
      # Next build keeps a Turbopack cache too, under the image's name: a
      # deploy that leaves the image alone neither builds nor saves it.
      - name: Name the containers' image
        id: image
        run: echo "tag=$(node scripts/cf-container-image.mjs --tag)" >> "$GITHUB_OUTPUT"
      - name: Restore the image build's Next.js cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cf-image-next
          key: cf-image-next-${{ hashFiles('bun.lock') }}-${{ steps.image.outputs.tag }}
          restore-keys: cf-image-next-${{ hashFiles('bun.lock') }}-
      # The last builds' hashed script and style files, uploaded again so tabs
      # opened before this deploy keep working (scripts/cf-deploy.sh).
      - name: Restore earlier builds' static files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .open-next-history
          key: cf-static-history-${{ github.run_id }}
          restore-keys: cf-static-history-
      - name: Build and deploy
        run: bun run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 8a4f309f2639721dc9f4f0d1790fd6d5
          # Compiled into the client bundle, so public by nature.
          NEXT_PUBLIC_POSTHOG_KEY: phc_eFCkNQ44Ek1rS522DObWVHWHHolVQf2HTFwPDFaOIlZ
          NEXT_PUBLIC_PRESENCE_URL: wss://gitdiagram-presence.gitdiagram-presence.workers.dev
          NEXT_PUBLIC_VIDEO_EXPLAINER: "1"
          NEXT_PUBLIC_GITHUB_CONNECT: "1"
          # Names the /<key>.txt rewrite at build time.
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          # No production secrets here, so pages prerendered by this build
          # have no data: the Worker renders them on first request instead.
          CF_SKIP_CACHE_POPULATE: "1"
          # Build the containers' image with BuildKit, reusing the last
          # image's layers (scripts/cf-container-image.mjs).
          CF_IMAGE_BUILDX: "1"
          CF_IMAGE_NEXT_CACHE: ${{ runner.temp }}/cf-image-next
