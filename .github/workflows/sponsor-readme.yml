name: Sponsor README schedule

on:
  workflow_dispatch:
  schedule:
    # UTC. Every 15 minutes, so the README follows any campaign boundary in
    # src/lib/sponsor-campaign.ts without per-date cron lines. A run with no
    # change is a no-op; GitHub may delay or skip scheduled runs, and the next
    # one catches up. The website handoff does not depend on Actions.
    - cron: "4,19,34,49 * * * *"

permissions: {}

concurrency:
  group: sponsor-readme
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'ahmedkhaleel2004/gitdiagram'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Keep the token out of .git/config; only the push step gets it.
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      # No `bun install`: the script and its imports use no packages
      # (enforced by src/lib/sponsor-readme.test.ts).
      - name: Sync only the sponsor block
        run: bun scripts/sync-sponsor-readme.ts
      - name: Commit a changed placement
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update scheduled sponsor placement"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin HEAD:main
