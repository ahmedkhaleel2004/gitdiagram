name: Sponsor README schedule

on:
  workflow_dispatch:
  schedule:
    # UTC. Sent ends Oct 19 at 22:23:01; retry through the handoff hour.
    - cron: "24,29,34,39,44,49,54,59 22 19 10 *"
    # CodeRabbit ends Nov 19 at 05:00 UTC (midnight Toronto after DST).
    - cron: "3,13,23,33,43,53 5 19 11 *"
    # Daily reconciliation also recovers a missed scheduled run.
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: sponsor-readme
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'ahmedkhaleel2004/gitdiagram'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Sync only the sponsor block
        run: bun scripts/sync-sponsor-readme.ts
      - name: Commit a changed placement
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update scheduled sponsor placement"
          git push origin HEAD:main
