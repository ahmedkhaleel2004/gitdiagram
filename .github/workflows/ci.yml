name: CI

on:
  pull_request:
  push:
    branches:
      - main

# A newer push to a branch or pull request replaces its running checks; every
# push to main still gets a full run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs; Dependabot keeps them
# current along with the version comments.
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ESLint, Vitest (jsdom), Prettier and the budget scripts run on Node,
      # not Bun. The version comes from engines.node in package.json.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Cache Bun packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install dependencies
        run: bun ci
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Formatting
        run: bun run format:check
      - name: Dead code and dependency boundaries
        run: bun run knip
      - name: Dependency audit
        run: bun audit
      - name: Tests
        run: bun run test
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379
      - name: Cache Next.js build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'public/**', 'next.config.js', 'tsconfig.json', 'postcss.config.js') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      - name: Build
        run: bun run build
      - name: Video render binaries are traced
        run: bun run check:video-tracing
      - name: Performance budgets
        run: bun run perf:budget
      - name: Standalone container build
        run: docker build --tag gitdiagram-ci .

  # The live-presence Cloudflare Worker has its own lockfile and tsconfig, and
  # the app's lint, typecheck and knip skip it.
  presence-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/presence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun ci
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        # `bun run --if-present test` would fall back to /usr/bin/test, so
        # check for the script first.
        run: |
          if bun -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            bun run test
          else
            echo "No test script."
          fi
      - name: Dependency audit
        run: bun audit
